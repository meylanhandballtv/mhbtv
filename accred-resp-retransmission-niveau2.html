        <h1>Certificat de <em>Sous-Directeur/Directeur des Opérations en multiplex</em></h1>
        <p class="hero-sub">Questionnaire d'accréditation conditionnant l'accès du titre de Sous-Directeur ou de Directeur des Opérations de Retransmission lors d'une production multiplex.</p>
      </div>
    </div>

      <div class="doc-toolbar"><a href="index.html" class="doc-back">← Retour à l'accueil</a></div>

      <!-- ============================================================ -->
      <!-- ZONE À MODIFIER : questions                                   -->
      <!-- Une question = { question, options (2 à 6), answer, article } -->
      <!--   answer  : index de la bonne réponse (0 = 1re option)        -->
      <!--   article : référence affichée au-dessus de la question       -->
      <!--             (laisser "" si aucune)                            -->
      <!-- Pour ajouter une question : copier un bloc { ... }, + virgule -->
      <!-- Les anciens tableaux (question/options/answer ou q/opts/ans)  -->
      <!-- se collent tels quels ici.                                    -->
      <!-- ============================================================ -->
      <script>
        const QUESTIONS = [
          { 
            question: "Que prévoit le règlement sur la nature des fonctions de Responsable de Retransmission, de Sous-Directeur et de Directeur des Opérations ?",
            options: ["Ce sont des grades permanents, conservés d'une diffusion à l'autre", "Elles ne constituent pas un grade permanent : elles sont exercées pour une diffusion et pour elle seule, sans statut ni prérogative en dehors", "Elles confèrent la qualité de membre de la Coordination Générale pendant toute la saison", "Elles sont attribuées à vie dès que l'accréditation est obtenue"],
            answer: 1, article: "" 
          },
          { 
            question: "Pour une diffusion réalisée en multiplex, que désigne l'autorité de planification ?",
            options: ["Un Chef d'Équipe par site, sans Directeur des Opérations", "Un Directeur des Opérations par site", "Un Directeur des Opérations et un Sous-Directeur des Opérations par site", "Un Sous-Directeur des Opérations unique pour l'ensemble des sites"],
            answer: 2, article: "" 
          },
          { 
            question: "Quel est le champ d'exercice du Sous-Directeur des Opérations (SDOR) ?",
            options: ["Un site déterminé dans le cadre d'une retransmission multiplex, avec les mêmes prérogatives qu'un Chef d'Équipe sur le fonctionnement matériel et humain de ce site, sous réserve des instructions de coordination du Directeur des Opérations", "L'ensemble d'une retransmission multiplex, tous sites confondus", "Un match unique sur un seul site, sans lien avec un multiplex", "La seule centralisation des comptes rendus, sans autorité sur le site"],
            answer: 0, article: "" 
          },
          { 
            question: "Un incident propre à son site, n'affectant pas les autres sites d'un multiplex, survient. Que fait le SDOR ?",
            options: ["Il attend les instructions du Directeur des Opérations avant toute mesure", "Il saisit l'ICR, qui décide à sa place", "Il décide seul, sans avoir à informer le Directeur des Opérations", "Il décide seul des mesures à prendre, dans les conditions des articles 16 à 22, et en informe sans délai le Directeur des Opérations"],
            answer: 3, article: "" 
          },
          { 
            question: "Qui est seul compétent pour décider d'une mesure affectant simultanément plusieurs sites, notamment l'interruption générale d'une diffusion multiplex ?",
            options: ["Les Sous-Directeurs, à la majorité", "Le Directeur des Opérations", "Le chef de département Officiels de Retransmission", "Le club receveur"],
            answer: 1, article: "" 
          },
          { 
            question: "Comment sont traités les comptes rendus d'une diffusion multiplex ?",
            options: ["Chaque Sous-Directeur transmet le sien séparément à l'ICR, sans centralisation", "Le Directeur des Opérations en rédige un seul, sans l'apport des sites", "Le Directeur des Opérations centralise les comptes rendus établis par chaque Sous-Directeur en une fiche unique de diffusion multiplex", "Ils sont centralisés par la Coordinatrice adjointe"],
            answer: 2, article: "" 
          },
          { 
            question: "Qui représente le collectif auprès des tiers (club receveur, officiels de la rencontre, instances sportives) lors d'une diffusion multiplex, et pour quelle durée ?",
            options: ["Le Sous-Directeur de chaque site, pour toute la saison", "Le chef de département Officiels de Retransmission, pour toute la saison", "Le Chef d'Équipe du site principal, pour la durée du match", "Le Directeur des Opérations, pour la durée de la diffusion"],
            answer: 3, article: "" 
          },
          { 
            question: "Quelles sont les conditions cumulatives d'accès à l'accréditation Sous-Directeur ?",
            options: ["Accréditation Chef d'Équipe active ; trois diffusions réalisées en autonomie comme Chef d'Équipe dans des conditions satisfaisantes ; formation complémentaire à la coordination multiplex ; absence de sanction disciplinaire active dans les 12 derniers mois", "Accréditation Chef d'Équipe active ; une seule diffusion en autonomie ; absence de sanction disciplinaire active dans les 6 derniers mois", "Accréditation Directeur des Opérations ; trois diffusions multiplex ; absence de sanction disciplinaire active dans les 24 derniers mois", "Certification au questionnaire d'accréditation et observation d'un seul match"],
            answer: 0, article: "" 
          },
          { 
            question: "Quelles sont les conditions cumulatives d'accès à l'accréditation Directeur des Opérations ?",
            options: ["Accréditation Chef d'Équipe active ; trois diffusions en autonomie ; absence de sanction disciplinaire active dans les 12 derniers mois", "Accréditation Sous-Directeur active ; trois diffusions multiplex réalisées comme Sous-Directeur ; absence de sanction disciplinaire active dans les 24 derniers mois ; validation par le chef de département Officiels de Retransmission avec approbation du Bureau", "Accréditation Sous-Directeur active ; une saison complète d'ancienneté ; élection par l'Assemblée générale", "Accréditation Sous-Directeur active ; trois diffusions multiplex ; absence de sanction disciplinaire active dans les 12 derniers mois ; validation du seul Coordinateur général"],
            answer: 1, article: "" 
          },
          { 
            question: "La Coordination Générale peut-elle déroger à la condition de nombre de diffusions multiplex pour l'accréditation Directeur des Opérations ?",
            options: ["Non, aucune dérogation n'est possible", "Oui, sur simple décision du chef de département Officiels de Retransmission", "Oui, à titre exceptionnel et sur avis motivé, notamment en cas d'expérience équivalente acquise dans une autre structure de retransmission sportive ou de nécessité opérationnelle impérieuse consignée au procès-verbal de la CG", "Oui, mais uniquement après un vote de l'Assemblée générale"],
            answer: 2, article: "" 
          },
          { 
            question: "Laquelle de ces notions fait partie de la formation complémentaire suivie avant l'accréditation Sous-Directeur ?",
            options: ["Le montage vidéo en post-production", "La gestion budgétaire du collectif", "L'organisation des procédures électorales de l'ICR", "La coordination d'une production multiplex et la répartition des rôles entre les membres présents sur chaque site"],
            answer: 3, article: "" 
          },
          { 
            question: "Qui statue sur l'attribution d'une accréditation Sous-Directeur ou Directeur des Opérations ?",
            options: ["La Coordination générale, sur avis motivé et dossier transmis par le chef de département Officiels de Retransmission", "Le chef de département Officiels de Retransmission, seul", "L'ICR, par délibération conjointe de ses chefs de département", "L'Assemblée générale, à bulletin secret"],
            answer: 0, article: "" 
          },
          { 
            question: "Quelle règle s'applique aux rencontres de niveau 3 ou inférieur lorsqu'une rencontre de niveau 1 ou 2 est programmée ?",
            options: ["La même règle s'applique, mais avec une fenêtre de 24 heures", "Aucune rencontre de niveau 3 ou inférieur ne peut être maintenue si elle réduit les moyens d'une rencontre de niveau 1 ou 2 programmée le même jour ou dans les 48 heures", "Elles peuvent toujours être maintenues avec l'accord du club", "La règle ne vaut que pour les rencontres de niveau 1, pas pour celles de niveau 2"],
            answer: 1, article: "" 
          },
          { 
            question: "Que confère la désignation d'un membre pour une diffusion déterminée ?",
            options: ["Une priorité de désignation pour les diffusions suivantes", "Un droit acquis à exercer la fonction pour toute la saison", "Aucun droit acquis ni priorité pour une diffusion ultérieure ; elle prend fin de plein droit à l'issue de la diffusion", "Un statut permanent jusqu'au renouvellement de l'accréditation"],
            answer: 2, article: "" 
          },
          { 
            question: "Quelles mesures le Chef d'Équipe, le Sous-Directeur ou le Directeur des Opérations peut-il prendre à l'égard des membres placés sous sa supervision ?",
            options: ["Prononcer un blâme inscrit au dossier du membre", "Suspendre l'accréditation du membre pour la saison", "Prononcer une sanction disciplinaire en cas de manquement grave", "Adresser un rappel à l'ordre verbal, retirer provisoirement un poste ou une mission, ou exclure un membre de la retransmission en cours en cas de manquement grave ou de refus caractérisé de se conformer à ses instructions"],
            answer: 3, article: "" 
          },
          { 
            question: "Que devient un rappel à l'ordre verbal une fois prise dans le cadre de son pouvoir disciplinaire immédiate ?",
            options: ["Il est consigné dans la fiche de compte rendu et portée sans délai à la connaissance du chef de département Officiels de Retransmission, qui apprécie l'opportunité de saisir l'ICR", "Il est notifié à la Coordination Générale, qui prononce la sanction", "Il vaut sanction disciplinaire au sens du Règlement disciplinaire", "Il n'a pas à être consigné, étant purement conservatoire"],
            answer: 0, article: "" 
          },
          { 
            question: "Dans l'attente de l'issue d'une procédure disciplinaire, une accréditation fait l'objet d'une suspension provisoire. Que prévoit le règlement ?",
            options: ["Elle est prononcée par l'ICR et le membre perd toutes ses accréditations", "Elle est prononcée par le Bureau, sur proposition du chef de département Officiels de Retransmission ou de l'ICR ; le membre reste éligible aux désignations correspondant à ses accréditations non suspendues", "Elle est prononcée par le chef de département seul et elle est définitive", "Elle est prononcée par le Bureau et rend le membre inéligible à toute désignation"],
            answer: 1, article: "" 
          },
          { 
            question: "À quelles conditions une accréditation peut-elle être retirée purement et simplement ?",
            options: ["Dès l'ouverture d'une procédure disciplinaire, par décision de la Coordination Générale", "Par décision du chef de département Officiels de Retransmission, seul, en cas de manquement", "Uniquement après décision définitive de l'ICR statuant en matière disciplinaire, le retrait étant alors prononcé par la Coordination Générale", "Par décision de l'Assemblée générale"],
            answer: 2, article: "" 
          },
          { 
            question: "Dans quel délai un membre peut-il former un recours motivé auprès de la Coordination Générale contre une décision individuelle, et dans quel délai le Bureau de l'Inspection Générale statue-t-il ?",
            options: ["72 heures ; le Bureau statue sous 7 jours", "7 jours ; le Bureau statue sous 15 jours", "30 jours ; le Bureau statue sous 15 jours", "15 jours à compter de la notification ; le Bureau statue sous 30 jours"],
            answer: 3, article: "" 
          },
          { 
            question: "Quelle est la durée de validité d'une accréditation ?",
            options: ["Une saison sportive ; elle doit être renouvelée au début de chaque saison, ce qui conditionne l'éligibilité à toute désignation", "Deux saisons sportives, sans renouvellement intermédiaire", "Illimitée, sauf retrait", "Douze mois glissants à compter de la date d'attribution"],
            answer: 0, article: "" 
          },
        ];

        /* ⚙️ RÉGLAGES DE CE QCM */
        window.QCM_CONFIG = {
          id: "Responsable de retransmission",                       // identifiant interne (reçu dans l'e-mail)
          level: "Niveau 2",                 // affiché dans la pastille
          certificat: "Sous-Directeur / Directeur des Opérations de Retransmission (Niveau 2)",       // titre complet (e-mail)
          poste: "SDOR / DOR",                 // poste concerné (e-mail)
          passMark: 12,                       // seuil de réussite, sur 20
          draw: 10,                           // 0 = toutes les questions ; N = N questions tirées au hasard
          showScore: false,                  // afficher la note au candidat
          showCorrection: false,             // afficher la correction détaillée (si showScore)
          sendOnlyIfPassed: false,            // true = n'envoyer à l'ICR que les réussites
          about: [
            "Ce QCM porte sur les pouvoirs propres au titre Sous-Directeur/Directeur des Opérations de Retransmission, et sur les conditions d'accès, le bilan de saison et la formation complémentaire préalable.",
            "La réussite de ce questionnaire, combinée aux conditions cumulatives nécessaires, conditionne l'attribution du titre de <strong>Sous-Directeur/Directeur des Opérations de Retransmission</strong>."
          ],
          questions: QUESTIONS
        };
      </script>
