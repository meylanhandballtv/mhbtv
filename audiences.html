<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audiences | Meylan Handball TV</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }
    .filter-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.4rem 0.9rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(232,0,29,0.1);
      border-color: var(--red);
      color: var(--red);
    }

    /* ── AUDIENCE GRID ── */
    .audience-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }
    .audience-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.25s, border-color 0.25s;
    }
    .audience-card:hover { transform: translateY(-4px); border-color: var(--red); }
    .audience-card-head {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .audience-month {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      color: var(--white);
    }
    .audience-season {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      background: rgba(232,0,29,0.1);
      border: 1px solid rgba(232,0,29,0.2);
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
    }

    /* ── STATS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
    }
    .stat {
      background: var(--card);
      padding: 1rem 1.25rem;
    }
    .stat-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      line-height: 1;
      color: var(--white);
      letter-spacing: 0.03em;
    }
    .stat-value small {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: 0.2rem;
    }
    .stat-value.empty { color: var(--muted); }
    .stat-delta {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      margin-top: 0.3rem;
      color: var(--muted);
    }
    .stat-delta.up { color: #3ecf6e; }
    .stat-delta.down { color: var(--red); }

    /* ── SEASON BLOCK ── */
    .season-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--red);
      border-radius: 6px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
    }
    .season-block-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      color: var(--white);
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    .season-block p { font-size: 0.85rem; color: var(--muted); }

    @media (max-width: 900px) {
      .audience-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <script src="nav.js"></script>

  <main class="page">
    <!-- HERO -->
    <div class="hero">
      <div class="hero-accent"></div>
      <div class="hero-content">
        <div class="hero-eyebrow">Documentation — Statistiques</div>
        <h1>Rapports <em>d'Audiences</em></h1>
        <p class="hero-sub">Statistiques de visionnage mensuelles de la chaîne YouTube Meylan Handball TV.</p>
      </div>
    </div>

    <section class="section">
      <h2 class="section-title">Saison <span>2026-2027</span></h2>
      <div class="section-line"></div>

      <div class="season-block">
        <div class="season-block-title">Saison en cours — 2026-2027</div>
        <p>Rapports d'audiences disponibles depuis octobre 2024. Les rapports sont mis à jour chaque mois par le Bureau.</p>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-season="all">Toutes les saisons</button>
        <button class="filter-btn" data-season="2026-2027">2026-2027</button>
        <button class="filter-btn" data-season="2025-2026">2025-2026</button>
        <button class="filter-btn" data-season="2024-2025">2024-2025</button>
      </div>

      <div class="audience-grid" id="audienceGrid"></div>
    </section>
  </main>

  <script src="footer.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════
    //  DONNÉES — à compléter chaque mois (ajouter une ligne en haut)
    //  y = année, m = mois (1-12)
    //  vues         : nombre de vues
    //  heures       : heures de visionnage
    //  spectateurs  : téléspectateurs cumulés
    //  retrans      : heures de retransmission (direct)
    //  Laisser null tant que la valeur n'est pas connue (affiche « — »).
    // ════════════════════════════════════════════════════════════
    const AUDIENCES = [
      // ── Saison 2026-2027 ──
      { y: 2026, m: 10, vues: 2 283, heures: 191.7, spectateurs: 591, retrans: 12.8 },
      { y: 2026, m: 9,  vues: 1 861, heures: 126.4, spectateurs: 479, retrans: 10.4 },
      // ── Saison 2025-2026 ──
      { y: 2026, m: 8,  vues: 865, heures: 78.9, spectateurs: 248, retrans: 16.8 },
      { y: 2026, m: 7,  vues: 215, heures: 25.4, spectateurs: 66, retrans: 5.1 },
      { y: 2026, m: 6,  vues: 2 025, heures: 251.6, spectateurs: 905, retrans: 10.0 },
      { y: 2026, m: 5,  vues: 583, heures: 72.6, spectateurs: 244, retrans: 4.9 },
      { y: 2026, m: 4,  vues: 461, heures: 47.8, spectateurs: 194, retrans: 1.4 },
      { y: 2026, m: 3,  vues: 1 364, heures: 142.3, spectateurs: 657, retrans: 12.4 },
      { y: 2026, m: 2,  vues: 1 081, heures: 133.0, spectateurs: 499, retrans: 8.1 },
      { y: 2026, m: 1,  vues: 1 690, heures: 212.2, spectateurs: 722, retrans: 16.3 },
      { y: 2025, m: 12, vues: 691, heures: 80.8, spectateurs: 298, retrans: 4.7 },
      { y: 2025, m: 11, vues: 1 428, heures: 182.8, spectateurs: 653, retrans: 14.9 },
      { y: 2025, m: 10, vues: 1 179, heures: 153.6, spectateurs: 537, retrans: 15.2 },
      { y: 2025, m: 9,  vues: 1 014, heures: 131.6, spectateurs: 536, retrans: 6.4 },
      // ── Saison 2024-2025 ──
      { y: 2025, m: 8,  vues: 668, heures: 102.2, spectateurs: 335, retrans: 8.2 },
      { y: 2025, m: 7,  vues: 144, heures: 23.9, spectateurs: 58, retrans: null },
      { y: 2025, m: 6,  vues: 528, heures: 50.3, spectateurs: 280, retrans: 3.4 },
      { y: 2025, m: 5,  vues: 2 354, heures: 260.8, spectateurs: 1.064, retrans: 23.1 },
      { y: 2025, m: 4,  vues: 140, heures: 12.0, spectateurs: 70, retrans: null },
      { y: 2025, m: 3,  vues: 1 211, heures: 126.7, spectateurs: 489, retrans: 10.3 },
      { y: 2025, m: 2,  vues: 652, heures: 74.2, spectateurs: 263, retrans: 6.3 },
      { y: 2025, m: 1,  vues: 1 217, heures: 157.4, spectateurs: 526, retrans: 11.7 },
      { y: 2024, m: 12, vues: 537, heures: 32.8, spectateurs: 293, retrans: 2.8 },
      { y: 2024, m: 11, vues: 457, heures: 66.3, spectateurs: 226, retrans: 7.3 },
      { y: 2024, m: 10, vues: 531, heures: 69.8, spectateurs: 284, retrans: 9.3 },
    ];

    // Les 4 critères : clé, libellé, suffixe d'unité
    const METRICS = [
      { key: 'vues',        label: 'Vues',                    unit: '' },
      { key: 'heures',      label: 'Heures de visionnage',    unit: 'h' },
      { key: 'spectateurs', label: 'Téléspectateurs cumulés', unit: '' },
      { key: 'retrans',     label: 'Heures de retransmission', unit: 'h' },
    ];

    const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

    // Saison sportive : septembre → août
    function seasonOf(y, m) {
      return m >= 9 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
    }

    function fmt(n) {
      return n.toLocaleString('fr-FR', { maximumFractionDigits: 1 });
    }

    // Variation vs mois précédent (l'entrée suivante dans le tableau)
    function deltaHTML(cur, prev) {
      if (typeof cur !== 'number' || typeof prev !== 'number' || prev === 0) return '';
      const pct = ((cur - prev) / prev) * 100;
      const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : '';
      const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '=';
      const sign = pct > 0 ? '+' : '';
      return `<div class="stat-delta ${cls}">${arrow} ${sign}${pct.toFixed(1).replace('.', ',')} % vs mois préc.</div>`;
    }

    function render() {
      const grid = document.getElementById('audienceGrid');
      grid.innerHTML = AUDIENCES.map((a, i) => {
        const season = seasonOf(a.y, a.m);
        const prev = AUDIENCES[i + 1];
        const stats = METRICS.map(mt => {
          const v = a[mt.key];
          const has = typeof v === 'number';
          const value = has
            ? `${fmt(v)}${mt.unit ? `<small>${mt.unit}</small>` : ''}`
            : '—';
          return `
            <div class="stat">
              <div class="stat-label">${mt.label}</div>
              <div class="stat-value ${has ? '' : 'empty'}">${value}</div>
              ${prev ? deltaHTML(v, prev[mt.key]) : ''}
            </div>`;
        }).join('');

        return `
          <div class="audience-card" data-season="${season}">
            <div class="audience-card-head">
              <span class="audience-month">${MONTHS[a.m - 1]} ${a.y}</span>
              <span class="audience-season">${season}</span>
            </div>
            <div class="stats-grid">${stats}</div>
          </div>`;
      }).join('');
    }

    // ── FILTRE ──
    function filterAudiences(season, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.audience-card').forEach(card => {
        card.style.display = (season === 'all' || card.dataset.season === season) ? '' : 'none';
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => filterAudiences(btn.dataset.season, btn));
    });

    render();
  </script>
</body>
</html>
