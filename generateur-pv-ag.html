<style>

.top{position:sticky;top:0;background:var(--p);z-index:5;padding-bottom:.8rem;margin-bottom:1rem;border-bottom:1px solid var(--bd)}

.sub{font-size:.75rem;color:var(--mu)}

button{font:600 .82rem 'Barlow Condensed',sans-serif;letter-spacing:.03em;border-radius:6px;border:1px solid var(--bd);background:var(--p2);color:var(--li);padding:.4rem .75rem;cursor:pointer}
button:hover{border-color:var(--red);color:var(--w)}
button.pr{background:var(--red);border-color:var(--red);color:#fff}
.ch button{padding:.15rem .45rem;font-size:.72rem}.x:hover{color:var(--red)}
fieldset{border:1px solid var(--bd);border-radius:8px;padding:.8rem;margin-bottom:.9rem}
legend{font:700 .68rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:0 .4rem}
label{display:block;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:.45rem 0 .2rem}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:5px;color:var(--w);padding:.4rem .5rem;font:.85rem Barlow,sans-serif}
textarea{resize:vertical;min-height:3.4rem}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0 .5rem}
.full{grid-column:1/-1}
.card{background:var(--p2);border:1px solid var(--bd);border-left:3px solid var(--red);border-radius:8px;padding:.6rem;margin:.4rem 0}
.card .card{background:var(--bg);border-left-color:var(--bd)}
.blk{border-left-color:var(--gold)}
.ch{display:flex;justify-content:space-between;align-items:center}
.ch b{font:700 .7rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.ch span{display:flex;gap:.2rem}
.addr{display:flex;gap:.4rem;margin-top:.4rem}
.preview{display:flex;flex-direction:column;background:#000}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem 1rem;background:var(--p);border-bottom:1px solid var(--bd);font-size:.78rem;color:var(--mu)}
iframe{flex:1;width:100%;border:0;background:#09090f}
</style>
</head>
<body>
<script src="nav.js"></script>

        <button data-a="rs">Vierge</button>

      <input type="file" id="imp" accept=".json" hidden>
    </div>
    <div id="root"></div>
  </div>
  <div class="preview">
    <div class="pbar"><span>Aperçu en direct</span><button data-a="pr">🖨 Imprimer / PDF</button></div>
    <iframe id="pv"></iframe>
  </div>
</div>

<script>
/* ═══ SCHÉMA ═══ (ajouter un type de bloc = 1 entrée ici + 1 fonction dans R) */
var F={
  t:function(k,l){return{k:k,l:l,t:'text'}},
  a:function(k,l){return{k:k,l:l,t:'area'}},
  n:function(k,l){return{k:k,l:l,t:'num'}},
  s:function(k,l,o){return{k:k,l:l,t:'sel',o:o}},
  L:function(k,l,f){return{k:k,l:l,t:'list',f:f}}
};
var DT=[['none','Sans couleur'],['up','Vert (hausse)'],['down','Rouge (baisse)'],['neu','Gris']];
var SCH={
  text:{n:'Texte',f:[F.a('content','Paragraphes (ligne vide = nouveau §, **gras** possible)'),F.s('size','Taille',[['n','Normale'],['s','Petite / note']])]},
  sub:{n:'Sous-titre',f:[F.t('text','Texte (ex : A. Coordinateur adjoint — 1er tour)')]},
  vote:{n:'Vote(s)',f:[F.L('rows','Résolutions (plusieurs lignes = un seul tableau)',[F.t('subject','Objet'),F.n('pour','Pour'),F.n('contre','Contre'),F.n('abst','Abst. / blanc')]),F.s('col','3e colonne',[['Abstentions','Abstentions'],['Vote blanc','Vote blanc']]),F.t('res','Résultat (ex : Le rapport est approuvé.)')]},
  stats:{n:'Statistiques',f:[F.t('period','Titre de période (optionnel)'),F.n('cols','Colonnes fixes (0 = auto)'),F.s('txt','Style valeur',[['0','Chiffre (grand)'],['1','Texte']]),F.L('cards','Cartes',[F.t('label','Libellé'),F.t('value','Valeur'),F.t('delta','Variation'),F.s('dt','Couleur',DT)])]},
  table:{n:'Tableau élection',f:[F.t('head','Titre 1re colonne (déf. Candidat(e))'),F.L('rows','Lignes',[F.t('name','Nom'),F.t('votes','Voix'),F.t('pct','% (optionnel)'),F.t('res','Résultat'),F.s('rt','Style',[['none','Neutre'],['elu','Élu(e) — vert'],['pres','Président — or'],['vp','Vice-pdt — bleu'],['non','Non élu(e) — gris']])]),F.t('foot','Ligne de bas (ex : Votants : 13 · Voix totales : 39)')]},
  ranking:{n:'Classement',f:[F.L('rows','Lignes',[F.t('rank','Rang (ou ★)'),F.t('name','Nom'),F.t('pts','Points'),F.s('st','Style',[['none','Normal'],['top3','Podium — or'],['coord','Hors compétition — rouge']])]),F.t('note','Note sous le tableau')]},
  chips:{n:'Pastilles (bulletins…)',f:[F.L('items','Pastilles',[F.t('text','Libellé'),F.t('value','Valeur'),F.s('v','Style',[['n','Normal'],['needed','Rouge (requis)']])])]},
  callout:{n:'Encart',f:[F.s('variant','Couleur',[['','Rouge'],['info','Or'],['green','Vert'],['blue','Bleu']]),F.a('text','Texte (**gras** possible)')]},
  article:{n:'Article de règlement',f:[F.t('ref','Référence (ex : Article 4.2 — Responsable)'),F.s('color','Couleur',[['red','Rouge'],['gold','Or']]),F.a('text','Texte (**gras** possible)')]},
  proclist:{n:'Liste de procédures',f:[F.L('items','Points',[F.t('icon','Emoji'),F.t('title','Titre'),F.s('variant','Style',[['auto','Vert'],['conditional','Or'],['none','Neutre']]),F.a('text','Description')])]},
  cards:{n:'Cartes titre/texte',f:[F.L('items','Cartes',[F.t('title','Titre'),F.t('text','Texte')])]},
  kv:{n:'Lignes gauche/droite',f:[F.L('items','Lignes',[F.t('left','Gauche'),F.t('right','Droite (or)')])]},
  result:{n:'Ligne de résultat',f:[F.t('text','Ex : M. X est élu président.')]}
};
var PT=[['present','Présents (or)'],['visio','Visioconférence (bleu)'],['proxy','Procuration (clair)'],['absent','Non présents / excusés (gris)']];
var CL=[['','Gris'],['gold','Or'],['blue','Bleu'],['green','Vert'],['red','Rouge']];
var TOP=[
 {g:'En-tête',b:'meta',f:[F.t('badge','Badge'),F.t('label','Libellé au-dessus du titre'),F.t('t1','Titre ligne 1'),F.t('t2','Titre ligne 2 (rouge)'),F.t('wm','Filigrane (2-3 lettres)'),F.t('sub','Sous-titre (date · lieu)'),F.t('pres','Président de séance'),F.t('sec','Secrétaire de séance'),F.t('open','Ouverture'),F.t('close','Clôture'),F.s('nav','nav.js dans le fichier téléchargé',[['1','Oui'],['0','Non']])]},
 {g:'Présences (colonnes libres)',b:'',f:[F.L('presence','Groupes',[F.t('title','Titre'),F.s('type','Couleur',PT),F.L('rows','Personnes',[F.t('name','Nom'),F.t('role','Rôle')])])]},
 {g:'Quorum',b:'quorum',f:[F.t('pct','Pourcentage'),F.t('main','Ligne en gras'),F.a('detail','Suite du texte')]},
 {g:'Ordre du jour',b:'',f:[F.L('sections','Sections',[F.t('title','Titre'),{k:'blocks',l:'Blocs',t:'list',f:[]}])]},
 {g:'Compositions finales',b:'',f:[F.L('compo','Groupes',[F.t('header','Instance / bureau'),F.L('rows','Personnes',[F.t('name','Nom'),F.t('role','Rôle'),F.s('color','Couleur',CL)])])]},
 {g:'Clôture, signatures, pied de page',b:'end',f:[F.t('note','Note de clôture (encart vert)'),F.L('sigs','Signatures',[F.t('role','Fonction'),F.t('sub','Sous-fonction (optionnel)'),F.t('name','Nom')]),F.t('org','Pied : organisation'),F.t('mid','Pied : mention (déf. sous-titre)'),F.t('rest','Pied : fin')]}
];

/* ═══ ÉTAT ═══ */
var K='mhbtv-pv-ag',state,REG=[];
function mk(fs){var o={};fs.forEach(function(f){o[f.k]=f.t==='list'?(f.k==='blocks'?[]:[mk(f.f)]):f.t==='num'?0:f.t==='sel'?f.o[0][0]:''});return o}
function nb(t){var o=mk(SCH[t].f);o.type=t;return o}
function blank(){return{meta:{badge:'Meylan Handball TV',label:'Procès-Verbal · Assemblée Générale',t1:'Assemblée',t2:'Générale',wm:'AG',sub:'',pres:'',sec:'',open:'',close:'',nav:'1'},
 presence:[{title:'Membres présents',type:'present',rows:[{name:'',role:''}]},{title:'Représentés par procuration',type:'proxy',rows:[]},{title:'Membres non présents',type:'absent',rows:[]}],
 quorum:{pct:'',main:'',detail:"ont participé au vote. Le quorum prévu à l'article 13.2.2 des statuts étant atteint, l'Assemblée générale peut valablement délibérer."},
 sections:[{title:'',blocks:[]}],compo:[],end:{note:'',sigs:[{role:'Le Coordinateur général',sub:'',name:''}],org:'Meylan Handball TV',mid:'',rest:'Document interne — Usage réservé aux membres'}}}
function example(){var s=blank(),v=function(sub,p,c,a,r){var b=nb('vote');b.rows=[{subject:sub,pour:p,contre:c,abst:a}];b.res=r;return b},t=function(c){var b=nb('text');b.content=c;return b};
 s.meta.label='Procès-Verbal · Assemblée Générale Ordinaire & Élective';s.meta.sub='Réunion du -- -- 2026 · Gymnase des Buclos, Meylan';s.meta.pres='Xavier FINI';s.meta.sec='Marie DAL ZOTTO';s.meta.open='18h00';s.meta.close='19h00';
 s.presence[0].rows=[{name:'Xavier FINI',role:'Coordinateur général'},{name:'Marie DAL ZOTTO',role:'Coordinatrice adjointe'}];
 s.presence.splice(1,0,{title:'Présents en visioconférence',type:'visio',rows:[{name:'Enzo ACHOUR',role:''}]});
 s.quorum.pct='92%';s.quorum.main='12 membres sur 13';
 var el=nb('table');el.rows=[{name:'Nicolas MARIN',votes:'23',pct:'',res:'Élu Président',rt:'pres'},{name:'Yoan DUSSERT',votes:'10',pct:'',res:'Élu Vice-président',rt:'vp'},{name:'Tim TOUR',votes:'7',pct:'',res:'Élu',rt:'elu'},{name:'Nabil SABAH',votes:'3',pct:'',res:'Non élu',rt:'non'}];
 var ch=nb('chips');ch.items=[{text:'Bulletins exprimés',value:'12',v:'n'},{text:'Majorité absolue requise',value:'7',v:'needed'}];
 var rk=nb('ranking');rk.rows=[{rank:'1er',name:'Marie DAL ZOTTO',pts:'2 710 pts',st:'top3'},{rank:'★',name:'Xavier FINI',pts:'2 530 pts',st:'coord'}];rk.note='★ Classement hors compétition.';
 s.sections=[{title:"Approbation de l'ordre du jour",blocks:[t("Le président de séance soumet l'ordre du jour au vote de l'assemblée."),v("Approbation de l'ordre du jour",9,0,0,"L'ordre du jour est approuvé.")]},
  {title:'Élection',blocks:[el,ch]},{title:'Classement interne',blocks:[rk]}];
 return s}
function load(){try{var x=localStorage.getItem(K);if(x)return JSON.parse(x)}catch(e){}return example()}
function save(){try{localStorage.setItem(K,JSON.stringify(state))}catch(e){}}

/* ═══ UTILS ═══ */
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fm(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b style="color:var(--white)">$1</b>').replace(/\n/g,'<br>')}
function key(x){return /^\d+$/.test(x)?+x:x}
function gp(p){return p.split('.').reduce(function(o,k){return o[key(k)]},state)}
function sp(p,v){var a=p.split('.'),l=a.pop();gp(a.join('.')||'')[key(l)]=v}
var _gp=gp;gp=function(p){return p===''?state:_gp(p)};

/* ═══ BUILDER ═══ */
function fld(f,base,o){
  var p=base?base+'.'+f.k:f.k,v=o[f.k];
  if(f.t==='list')return lst(f,p,v);
  var h='<div class="'+(f.t==='area'?'full':'')+'"><label>'+f.l+'</label>';
  if(f.t==='area')h+='<textarea data-p="'+p+'">'+esc(v)+'</textarea>';
  else if(f.t==='sel')h+='<select data-p="'+p+'">'+f.o.map(function(x){return'<option value="'+x[0]+'"'+(x[0]===v?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select>';
  else h+='<input type="'+(f.t==='num'?'number':'text')+'" data-p="'+p+'" value="'+esc(v)+'">';
  return h+'</div>';
}
function lst(f,p,arr){
  var isB=f.k==='blocks',r=REG.push(f)-1;
  var h='<div class="full"><label>'+f.l+'</label>';
  arr.forEach(function(it,i){
    var fs=isB?SCH[it.type].f:f.f,d=' data-p="'+p+'" data-i="'+i+'"';
    h+='<div class="card'+(isB?' blk':'')+'"><div class="ch"><b>'+(isB?SCH[it.type].n:(i+1))+'</b><span>'
      +'<button data-a="mv"'+d+' data-d="-1">↑</button><button data-a="mv"'+d+' data-d="1">↓</button><button data-a="dup"'+d+'>⎘</button><button class="x" data-a="del"'+d+'>✕</button></span></div><div class="g">'
      +fs.map(function(g){return fld(g,p+'.'+i,it)}).join('')+'</div></div>';
  });
  if(isB)h+='<div class="addr"><select id="nb-'+p.replace(/\./g,'-')+'">'+Object.keys(SCH).map(function(t){return'<option value="'+t+'">'+SCH[t].n+'</option>'}).join('')+'</select><button data-a="addb" data-p="'+p+'">+ Bloc</button></div>';
  else h+='<button data-a="add" data-p="'+p+'" data-r="'+r+'">+ Ajouter</button>';
  return h+'</div>';
}
function render(){
  REG=[];
  document.getElementById('root').innerHTML=TOP.map(function(s){
    var o=gp(s.b);
    return'<fieldset><legend>'+s.g+'</legend><div class="g">'+s.f.map(function(f){return fld(f,s.b,o)}).join('')+'</div></fieldset>';
  }).join('');
}
var root=document.getElementById('builder'),tm;
root.addEventListener('input',function(e){var t=e.target;if(!t.dataset||!t.dataset.p)return;
  sp(t.dataset.p,t.type==='number'?(t.value===''?0:Number(t.value)):t.value);save();clearTimeout(tm);tm=setTimeout(prev,150)});
root.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!b.dataset.a)return;var a=b.dataset.a,d=b.dataset,arr;
  if(a==='dl'){return dl()}if(a==='pr'){return pr()}
  if(a==='exp')return exp();
  if(a==='imp')return document.getElementById('imp').click();
  if(a==='ex')state=example();
  else if(a==='rs'){if(!confirm('Repartir d\'un PV vierge ?'))return;state=blank()}
  else{arr=gp(d.p);
    if(a==='add')arr.push(mk(REG[d.r].f));
    else if(a==='addb')arr.push(nb(document.getElementById('nb-'+d.p.replace(/\./g,'-')).value));
    else if(a==='del')arr.splice(+d.i,1);
    else if(a==='dup')arr.splice(+d.i+1,0,JSON.parse(JSON.stringify(arr[+d.i])));
    else if(a==='mv'){var i=+d.i,j=i+ +d.d;if(j>=0&&j<arr.length){var x=arr[i];arr[i]=arr[j];arr[j]=x}}}
  save();render();prev();
});
document.querySelector('.pbar button').addEventListener('click',pr);
document.getElementById('imp').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o.meta||!o.sections)throw 0;state=o;save();render();prev()}catch(x){alert('JSON invalide.')}};r.readAsText(f);e.target.value=''});

var R={
 text:function(b){return String(b.content||'').split(/\n\s*\n/).map(function(p){return'<p class="prose'+(b.size==='s'?' s':'')+'">'+fm(p)+'</p>'}).join('')},
 sub:function(b){return'<div class="subsection-title">'+esc(b.text)+'</div>'},
 vote:function(b){return'<div class="vote-block"><table><thead><tr><th class="l">Résolution</th><th>Pour</th><th>Contre</th><th>'+esc(b.col)+'</th></tr></thead><tbody>'
  +b.rows.map(function(r){return'<tr><td class="subject">'+esc(r.subject)+'</td><td class="pour">'+esc(r.pour)+'</td><td class="contre">'+esc(r.contre)+'</td><td class="abst">'+esc(r.abst)+'</td></tr>'}).join('')+'</tbody></table>'
  +(b.res?'<div class="vote-result">'+esc(b.res)+'</div>':'')+'</div>'},
 stats:function(b){return(b.period?'<div class="period-title">'+esc(b.period)+'</div>':'')+'<div class="stats-grid"'+(+b.cols?' style="grid-template-columns:repeat('+(+b.cols)+',1fr)"':'')+'>'
  +b.cards.map(function(c){return'<div class="stat-card"><div class="stat-label">'+esc(c.label)+'</div><div class="stat-value'+(b.txt==='1'?' t':'')+'">'+esc(c.value)+'</div>'+(c.delta?'<div class="stat-delta'+(c.dt!=='none'?' delta-'+c.dt:'')+'">'+esc(c.delta)+'</div>':'')+'</div>'}).join('')+'</div>'},
 table:function(b){var pc=b.rows.some(function(r){return r.pct});
  return'<table><thead><tr><th class="l">'+esc(b.head||'Candidat(e)')+'</th><th>Voix obtenues</th>'+(pc?'<th>%</th>':'')+'<th class="l">Résultat</th></tr></thead><tbody>'
  +b.rows.map(function(r){var k=r.rt!=='none'&&r.rt!=='non'?r.rt:'';return'<tr'+(k?' class="row-'+k+'"':'')+'><td class="name">'+esc(r.name)+'</td><td class="votes">'+esc(r.votes)+'</td>'+(pc?'<td class="pct">'+esc(r.pct)+'</td>':'')+'<td class="r'+(r.rt!=='none'?' r-'+r.rt:'')+'">'+esc(r.res)+'</td></tr>'}).join('')+'</tbody></table>'+(b.foot?'<div class="foot">'+esc(b.foot)+'</div>':'')},
 ranking:function(b){return'<table><thead><tr><th>Rang</th><th class="l">Membre</th><th style="text-align:right">Points</th></tr></thead><tbody>'
  +b.rows.map(function(r){return'<tr'+(r.st!=='none'?' class="'+r.st+'"':'')+'><td class="rk">'+esc(r.rank)+'</td><td class="name">'+esc(r.name)+'</td><td class="pts">'+esc(r.pts)+'</td></tr>'}).join('')+'</tbody></table>'+(b.note?'<p class="prose s">'+esc(b.note)+'</p>':'')},
 chips:function(b){return'<div class="chips">'+b.items.map(function(i){return'<span class="chip'+(i.v==='needed'?' needed':'')+'">'+esc(i.text)+' : <span>'+esc(i.value)+'</span></span>'}).join('')+'</div>'},
 callout:function(b){return'<div class="callout '+esc(b.variant)+'">'+fm(b.text)+'</div>'},
 article:function(b){return'<div class="article-block '+(b.color==='gold'?'gold':'')+'"><div class="article-ref">'+esc(b.ref)+'</div>'+fm(b.text)+'</div>'},
 proclist:function(b){return'<div class="proc-list">'+b.items.map(function(i){return'<div class="proc-item '+(i.variant==='none'?'':i.variant)+'"><div class="proc-icon">'+esc(i.icon)+'</div><div class="proc-text"><strong style="color:var(--white)">'+esc(i.title)+'</strong> — '+fm(i.text)+'</div></div>'}).join('')+'</div>'},
 cards:function(b){return'<div class="carto-grid">'+b.items.map(function(i){return'<div class="carto-type"><div class="carto-type-name">'+esc(i.title)+'</div><div class="carto-type-crew">'+esc(i.text)+'</div></div>'}).join('')+'</div>'},
 kv:function(b){return'<div>'+b.items.map(function(i){return'<div class="carto-row"><span class="carto-comp">'+esc(i.left)+'</span><span class="carto-prod">'+esc(i.right)+'</span></div>'}).join('')+'</div>'},
 result:function(b){return'<div class="vote-result">'+esc(b.text)+'</div>'}
};
function doc(dl){
  var m=state.meta,E=state.end;
  var pres=state.presence.map(function(g){return'<div class="presence-card"><div class="presence-card-title '+(g.type==='absent'?'':g.type)+'">'+esc(g.title)+'</div><ul class="presence-list">'
    +g.rows.filter(function(r){return r.name}).map(function(r){return'<li><strong>'+esc(r.name)+'</strong>'+(r.role?'<span>'+esc(r.role)+'</span>':'')+'</li>'}).join('')+'</ul></div>'}).join('');
  var secs=state.sections.map(function(s,i){return'<div class="section"><div class="section-header"><span class="section-num">'+String(i+1).padStart(2,'0')+'</span><h2 class="section-title">'+esc(s.title)+'</h2></div><div class="section-line"></div>'+s.blocks.map(function(b){return R[b.type](b)}).join('')+'</div>'}).join('');
  var compo=state.compo.length?'<p class="prose">Composition des instances à l\'issue de l\'Assemblée générale :</p><div class="compo-grid">'+state.compo.map(function(g){return'<div class="compo-block"><div class="compo-block-header">'+esc(g.header)+'</div>'
    +g.rows.filter(function(r){return r.name}).map(function(r){return'<div class="compo-row"><span class="compo-name">'+esc(r.name)+'</span><span class="compo-role '+esc(r.color)+'">'+esc(r.role)+'</span></div>'}).join('')+'</div>'}).join('')+'</div>':'';
  return'<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PV — '+esc(m.t1)+' '+esc(m.t2)+' | '+esc(m.badge)+'</title>'
  +'<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"><style>'+CSS+'</style></head><body>'
  +(dl&&m.nav==='1'?'<script src="nav.js"><\/script>':'')
  +'<header class="hero" style="--wm:\''+String(m.wm||'AG').replace(/[\\\'"<>]/g,'')+'\'"><div class="hero-glow"></div><div class="hero-inner"><div class="hero-badge">'+esc(m.badge)+'</div><div class="hero-label">'+esc(m.label)+'</div>'
  +'<h1 class="hero-title">'+esc(m.t1)+'<br><em>'+esc(m.t2)+'</em></h1><p class="hero-sub">'+esc(m.sub)+'</p><div class="hero-meta">'
  +[['Président de séance',m.pres],['Secrétaire de séance',m.sec],['Ouverture',m.open],['Clôture',m.close]].map(function(x){return'<div class="meta-item"><span class="meta-label">'+x[0]+'</span><span class="meta-value">'+esc(x[1])+'</span></div>'}).join('')
  +'</div></div></header><main class="doc-body"><div class="presence-grid">'+pres+'</div>'
  +'<div class="quorum-bar"><div class="quorum-pct">'+esc(state.quorum.pct)+'</div><div class="quorum-text"><strong>'+esc(state.quorum.main)+'</strong> '+esc(state.quorum.detail)+'</div></div>'
  +secs+compo+(E.note?'<div class="callout green"><strong style="color:#4ade80">'+esc(E.note)+'</strong></div>':'')
  +'<div class="divider"></div><div class="signature-block">'+E.sigs.map(function(s){return'<div><div class="sig-role">'+esc(s.role)+'</div>'+(s.sub?'<div class="sig-sub">'+esc(s.sub)+'</div>':'')+'<div class="sig-name">'+esc(s.name)+'</div><div class="sig-line"></div></div>'}).join('')+'</div></main>'
  +'<footer class="doc-footer"><strong>'+esc(E.org)+'</strong> · Procès-Verbal — '+esc(E.mid||m.sub)+' · '+esc(E.rest)+'</footer></body></html>';
}
function prev(){document.getElementById('pv').srcdoc=doc(false)}
function pr(){var f=document.getElementById('pv');f.contentWindow.focus();f.contentWindow.print()}
function dwn(txt,type,name){var u=URL.createObjectURL(new Blob([txt],{type:type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},2000)}
function slug(){return((state.meta.sub||'document').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase().slice(0,40).replace(/^-+|-+$/g,''))||'pv'}
function dl(){dwn(doc(true),'text/html','PV-AG-'+slug()+'.html')}
function exp(){dwn(JSON.stringify(state,null,1),'application/json','PV-AG-'+slug()+'.json')}

state=load();render();prev();
</script>
