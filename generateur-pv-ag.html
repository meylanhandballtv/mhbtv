<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Générateur de PV — Assemblée Générale | Meylan Handball TV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b12; --panel:#111118; --panel2:#15151f; --border:#232332;
  --red:#e8001d; --red-dim:rgba(232,0,29,.12); --gold:#f5b800; --white:#f0f0f5;
  --muted:#7a7a90; --light:#b0b0c8; --green:#4ade80; --blue:#60a5fa;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--white); font-family:'Barlow',sans-serif; font-size:14px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.app{display:grid; grid-template-columns: 460px 1fr; height:100vh}
@media (max-width: 980px){ .app{grid-template-columns: 1fr; height:auto} }

/* ── PANEL BUILDER ─────────────────────────── */
.builder{
  background:var(--panel); border-right:1px solid var(--border);
  overflow-y:auto; padding:1.2rem 1.2rem 4rem;
}
.builder-top{
  position:sticky; top:0; background:var(--panel); z-index:5; padding-bottom:.8rem; margin-bottom:1rem;
  border-bottom:1px solid var(--border);
}
.app-title{font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:.03em; color:var(--white)}
.app-title em{color:var(--red); font-style:normal}
.app-sub{font-size:.75rem; color:var(--muted); margin-top:.15rem}
.top-actions{display:flex; gap:.5rem; margin-top:.8rem; flex-wrap:wrap}

button{
  font-family:'Barlow Condensed',sans-serif; font-weight:600; letter-spacing:.03em;
  border-radius:6px; border:1px solid var(--border); background:var(--panel2); color:var(--light);
  padding:.45rem .8rem; font-size:.82rem; cursor:pointer; transition:.15s;
}
button:hover{border-color:var(--red); color:var(--white)}
button.primary{background:var(--red); border-color:var(--red); color:#fff}
button.primary:hover{background:#c40018}
button.ghost{background:transparent}
button.small{padding:.25rem .55rem; font-size:.72rem}
button.danger:hover{border-color:var(--red); color:var(--red)}

fieldset{border:1px solid var(--border); border-radius:8px; padding:.8rem; margin-bottom:.9rem}
legend{
  font-family:'Barlow Condensed',sans-serif; font-size:.68rem; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--gold); padding:0 .4rem;
}
label{display:block; font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:.5rem 0 .25rem}
label:first-child{margin-top:0}
input[type=text], input[type=number], textarea, select{
  width:100%; background:var(--bg); border:1px solid var(--border); border-radius:5px; color:var(--white);
  padding:.45rem .55rem; font-family:'Barlow',sans-serif; font-size:.85rem;
}
textarea{resize:vertical; min-height:3.2rem; font-family:'Barlow',sans-serif}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:.5rem}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5rem}
.row4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:.5rem}

.card{background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:.7rem; margin-bottom:.6rem}
.card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:.4rem; gap:.5rem}
.card-head .tag{font-family:'Barlow Condensed',sans-serif; font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--red)}
.section-card{border-left:3px solid var(--red)}
.block-card{border-left:3px solid var(--gold); margin-left:.4rem}
.subcard{background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:.55rem; margin-bottom:.4rem}
.add-row{display:flex; gap:.4rem; align-items:center; margin-top:.4rem}
.add-row select{flex:1}
.hint{font-size:.72rem; color:var(--muted); margin-top:.2rem; line-height:1.4}

/* ── PREVIEW SIDE ─────────────────────────── */
.preview-side{display:flex; flex-direction:column; background:#000}
.preview-bar{
  display:flex; align-items:center; justify-content:space-between; gap:.6rem; flex-wrap:wrap;
  padding:.7rem 1rem; background:var(--panel); border-bottom:1px solid var(--border);
}
.preview-bar .info{font-size:.78rem; color:var(--muted)}
iframe{flex:1; width:100%; border:none; background:#09090f}
</style>
</head>

function blockTemplate(type){
  switch(type){
    case "text": return {type:"text", content:""};
    case "vote": return {type:"vote", subject:"", pour:0, contre:0, abstention:0, resultText:""};
    case "stats": return {type:"stats", periodTitle:"", cards:[{label:"",value:"",delta:"",deltaType:"none"}]};
    case "table": return {type:"table", intro:"", rows:[{name:"",votes:"",resultText:"",resultType:"none"}]};
    case "callout": return {type:"callout", text:"", variant:"default"};
    case "proclist": return {type:"proclist", items:[{icon:"⚡",title:"",text:"",variant:"auto"}]};
    default: return {type:"text", content:""};

}

/* ============================================================
   PATH UTILS
============================================================ */
function getParent(path){
  var parts = path.split(".");
  var last = parts.pop();
  var obj = state;
  for(var i=0;i<parts.length;i++){ obj = obj[parts[i]]; }
  return {obj:obj, key: /^\d+$/.test(last) ? parseInt(last,10) : last};
}
function getPath(path){
  var parts = path.split(".");
  var obj = state;
  for(var i=0;i<parts.length;i++){ obj = obj[ /^\d+$/.test(parts[i]) ? parseInt(parts[i],10) : parts[i] ]; }
  return obj;
}
function setPath(path, value){
  var p = getParent(path);
  p.obj[p.key] = value;
}
function addToArray(path, item){
  var arr = getPath(path);
  arr.push(item);
}
function removeFromArray(path, index){
  var arr = getPath(path);
  arr.splice(index,1);
}

/* ============================================================
   ESCAPE
============================================================ */
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function nl2p(s){
  return String(s||"").split(/\n\s*\n/).map(function(p){return '<p class="prose">'+esc(p).replace(/\n/g,"<br>")+'</p>';}).join("");
}

/* ============================================================
   BUILDER RENDER
============================================================ */
function inp(path, val, placeholder, type){
  type = type||"text";
  return '<input type="'+type+'" data-path="'+path+'" value="'+esc(val)+'" placeholder="'+esc(placeholder||"")+'">';
}
function txt(path, val, placeholder){
  return '<textarea data-path="'+path+'" placeholder="'+esc(placeholder||"")+'">'+esc(val)+'</textarea>';
}
function sel(path, val, options){
  var h = '<select data-path="'+path+'">';
  options.forEach(function(o){
    h += '<option value="'+o[0]+'"'+(o[0]===val?" selected":"")+'>'+o[1]+'</option>';
  });
  return h+'</select>';
}

function renderPresenceList(label, path, list){
  var h = '<div style="margin-bottom:.6rem"><label>'+label+'</label>';
  list.forEach(function(row,i){
    h += '<div class="subcard row2" style="align-items:center">'
      + '<div>'+inp(path+'.'+i+'.name', row.name, "Nom Prénom")+'</div>'
      + '<div style="display:flex;gap:.3rem">'+inp(path+'.'+i+'.role', row.role, "Rôle (optionnel)")
      + '<button class="small danger" data-action="removeItem" data-path="'+path+'" data-index="'+i+'">✕</button></div>'
      + '</div>';
  });
  h += '<button class="small" data-action="addPresence" data-path="'+path+'">+ Ajouter</button></div>';
  return h;
}

       + '<div><label>Contre</label>'+inp(base+'.contre', block.contre, "0","number")+'</div>'

    h += '<label>Titre de période (optionnel — ex : "Avril 2026")</label>'+inp(base+'.periodTitle', block.periodTitle, "");

    block.cards.forEach(function(c,ci){
      var cb = base+'.cards.'+ci;
      h += '<div class="subcard"><div class="row2">'+inp(cb+'.label', c.label, "Libellé")+inp(cb+'.value', c.value, "Valeur")+'</div>'

    block.rows.forEach(function(r,ri){

      h += '<div class="subcard"><div class="row2">'+inp(rb+'.name', r.name, "Nom")+inp(rb+'.votes', r.votes, "Voix / valeur")+'</div>'
        + '<div class="row2" style="margin-top:.35rem">'+inp(rb+'.resultText', r.resultText, "Texte resultat (ex : Elu)")
        + sel(rb+'.resultType', r.resultType, [["none","Neutre"],["elu","Vert — Élu"],["pres","Or — Président"],["vp","Bleu — Vice-président"],["non","Gris — Non élu"]])+'</div>'

    });

      var ib = base+'.items.'+ii;

============================================================ */
var builderRoot = document.getElementById("builder");

builderRoot.addEventListener("input", function(e){
  var t = e.target;
  if(t.dataset && t.dataset.path){
    var val = t.value;
    if(t.type==="number") val = val===""?"":Number(val);
    setPath(t.dataset.path, val);
    scheduleRender();
  }
});

builderRoot.addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(!b) return;
  var act = b.dataset.action;
  if(!act) return;

  if(act==="addSection"){ state.sections.push({title:"", blocks:[]}); }
  else if(act==="removeSection"){ state.sections.splice(parseInt(b.dataset.index,10),1); }
  else if(act==="addBlock"){
    var si = parseInt(b.dataset.si,10);
    var type = document.getElementById("newBlockType-"+si).value;
    state.sections[si].blocks.push(blockTemplate(type));
  }
  else if(act==="removeBlock"){ state.sections[parseInt(b.dataset.si,10)].blocks.splice(parseInt(b.dataset.bi,10),1); }
  else if(act==="addCard"){ state.sections[parseInt(b.dataset.si,10)].blocks[parseInt(b.dataset.bi,10)].cards.push({label:"",value:"",delta:"",deltaType:"none"}); }
  else if(act==="removeCard"){ state.sections[parseInt(b.dataset.si,10)].blocks[parseInt(b.dataset.bi,10)].cards.splice(parseInt(b.dataset.ci,10),1); }
  else if(act==="addRow"){ state.sections[parseInt(b.dataset.si,10)].blocks[parseInt(b.dataset.bi,10)].rows.push({name:"",votes:"",resultText:"",resultType:"none"}); }
  else if(act==="removeRow"){ state.sections[parseInt(b.dataset.si,10)].blocks[parseInt(b.dataset.bi,10)].rows.splice(parseInt(b.dataset.ri,10),1); }
  else if(act==="addProcItem"){ state.sections[parseInt(b.dataset.si,10)].blocks[parseInt(b.dataset.bi,10)].items.push({icon:"⚡",title:"",text:"",variant:"auto"}); }
  else if(act==="removeProcItem"){ state.sections[parseInt(b.dataset.si,10)].blocks[parseInt(b.dataset.bi,10)].items.splice(parseInt(b.dataset.ii,10),1); }
  else if(act==="addPresence"){ addToArray(b.dataset.path, {name:"",role:""}); }
  else if(act==="removeItem"){ removeFromArray(b.dataset.path, parseInt(b.dataset.index,10)); }
  else if(act==="addCompoGroup"){ state.compoGroups.push({header:"",rows:[{name:"",role:"",color:"default"}]}); }
  else if(act==="removeCompoGroup"){ state.compoGroups.splice(parseInt(b.dataset.index,10),1); }
  else if(act==="addCompoRow"){ state.compoGroups[parseInt(b.dataset.gi,10)].rows.push({name:"",role:"",color:"default"}); }
  else if(act==="removeCompoRow"){ state.compoGroups[parseInt(b.dataset.gi,10)].rows.splice(parseInt(b.dataset.ri,10),1); }
  else if(act==="addSignature"){ state.signatures.push({role:"",name:""}); }
  else if(act==="removeSignature"){ state.signatures.splice(parseInt(b.dataset.index,10),1); }
  else if(act==="loadExample"){ state = exampleState(); }
  else if(act==="reset"){ if(confirm("Repartir d'un document vierge ? Les modifications non téléchargées seront perdues.")) state = blankState(); }
  else if(act==="download"){ downloadDoc(); return; }
  else if(act==="print"){ printDoc(); return; }

  renderBuilderAndPreview();
});

var renderTimer = null;
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(updatePreview, 150);
}
function renderBuilderAndPreview(){
  renderBuilderRoot();
  updatePreview();
}

.vote-table th,.vote-table td{padding:0.8rem 1.2rem;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:0.9rem}\
.vote-table thead tr{background:#16161f}\
.vote-table th{font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);font-size:0.72rem;border-bottom:1px solid var(--border)}\
.vote-table td.subject{text-align:left;color:var(--white);font-weight:600;font-size:0.88rem}\
.vote-table td.pour{color:#4ade80;font-weight:700;font-size:1.1rem}.vote-table td.contre{color:var(--red);font-weight:700;font-size:1.1rem}.vote-table td.abstention{color:var(--muted);font-weight:600;font-size:1.1rem}\
.vote-result{display:inline-flex;align-items:center;gap:0.5rem;margin-top:0.6rem;font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:0.08em;color:#4ade80}\
.vote-result::before{content:'→'}\
.data-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:1rem 0;font-size:0.88rem}\
.data-table th{padding:0.75rem 1rem;background:#16161f;text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}\
.data-table td{padding:0.7rem 1rem;border-bottom:1px solid rgba(30,30,42,0.6);color:var(--light);font-family:'Barlow Condensed',sans-serif;font-size:0.92rem}\
.data-table tbody tr:last-child td{border-bottom:none}\
.data-table td.name{color:var(--white);font-weight:600}.data-table td.votes{font-weight:700;color:var(--white);text-align:center}\
.data-table td.result-elu{color:#4ade80;font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;letter-spacing:0.08em}\
.data-table td.result-pres{color:var(--gold);font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;letter-spacing:0.08em}\
.data-table td.result-vp{color:#60a5fa;font-weight:700;font-size:0.8rem;letter-spacing:0.08em}\
.data-table td.result-non{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:0.8rem}\
.data-table tr.row-elected{background:rgba(74,222,128,0.04)}.data-table tr.row-president{background:rgba(245,184,0,0.06)}.data-table tr.row-vp{background:rgba(96,165,250,0.05)}\
.compo-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}\
.compo-block{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}\
.compo-block-header{background:#16161f;padding:0.6rem 1rem;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}\
.compo-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 1rem;border-bottom:1px solid rgba(30,30,42,0.5);gap:1rem}\
.compo-row:last-child{border-bottom:none}\
.compo-name{font-family:'Barlow Condensed',sans-serif;font-size:0.9rem;font-weight:600;color:var(--white)}\
.compo-role{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;color:var(--muted);text-align:right}\
.compo-role.gold{color:var(--gold)}.compo-role.blue{color:#60a5fa}.compo-role.green{color:#4ade80}.compo-role.red{color:var(--red)}\
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0.75rem;margin:1rem 0}\
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem 1.1rem}\
.stat-label{font-family:'Barlow Condensed',sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.35rem}\
.stat-value{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--white);line-height:1}\
.stat-delta{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;font-weight:600;margin-top:0.2rem}\
.delta-up{color:#4ade80}.delta-down{color:var(--red)}.delta-neu{color:var(--muted)}\
.period-title{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin:1.5rem 0 0.6rem;display:flex;align-items:center;gap:0.5rem}\
.period-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(245,184,0,0.2),transparent)}\
.proc-list{margin:0.75rem 0;display:flex;flex-direction:column;gap:0.6rem}\
.proc-item{display:flex;gap:0.9rem;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.9rem 1.1rem}\
.proc-icon{font-size:1.1rem;flex-shrink:0;margin-top:0.05rem}\
.proc-text{font-size:0.88rem;color:var(--light);line-height:1.5}\
.proc-item.auto{border-left:3px solid #4ade80}.proc-item.conditional{border-left:3px solid var(--gold)}\
.callout{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:8px;padding:1rem 1.3rem;margin:1rem 0;font-size:0.88rem;color:var(--light);line-height:1.6}\
.callout.info{border-left-color:var(--gold)}.callout.green{border-left-color:#4ade80}\
.divider{height:1px;background:var(--border);margin:2.5rem 0}\
.signature-block{display:flex;gap:3rem;flex-wrap:wrap;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border)}\
.sig-role{font-family:'Barlow Condensed',sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.2rem}\
.sig-name{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:600;color:var(--white);margin-bottom:0.8rem}\
.sig-line{width:180px;height:1px;background:var(--border);margin-top:2rem}\
.doc-footer{background:var(--darker);border-top:1px solid var(--border);padding:1.5rem 2rem;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;color:var(--muted);letter-spacing:0.06em}\
.doc-footer strong{color:var(--white)}\
@media (max-width:700px){.hero{padding:2.5rem 1.5rem 2rem}.presence-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}.compo-grid{grid-template-columns:1fr}.doc-body{padding:2rem 1.25rem 4rem}}\
";

function presenceHTML(title, cls, list){
  var items = list.filter(function(r){return r.name;}).map(function(r){
    return '<li><strong>'+esc(r.name)+'</strong>'+(r.role?'<span>'+esc(r.role)+'</span>':'')+'</li>';
  }).join("");
  return '<div class="presence-card"><div class="presence-card-title '+cls+'">'+esc(title)+'</div><ul class="presence-list">'+items+'</ul></div>';
}

function voteBlockHTML(b){
  return '<div class="vote-block"><table class="vote-table"><thead><tr><th style="text-align:left">Résolution</th><th>Pour</th><th>Contre</th><th>Abstentions</th></tr></thead>'
    + '<tbody><tr><td class="subject">'+esc(b.subject)+'</td><td class="pour">'+esc(b.pour)+'</td><td class="contre">'+esc(b.contre)+'</td><td class="abstention">'+esc(b.abstention)+'</td></tr></tbody></table>'
    + (b.resultText? '<div class="vote-result">'+esc(b.resultText)+'</div>' : '')
    + '</div>';
}
function statsHTML(b){
  var cards = b.cards.map(function(c){
    var deltaCls = c.deltaType==="up"?"delta-up":c.deltaType==="down"?"delta-down":c.deltaType==="neu"?"delta-neu":"";
    return '<div class="stat-card"><div class="stat-label">'+esc(c.label)+'</div><div class="stat-value">'+esc(c.value)+'</div>'
      + (c.delta? '<div class="stat-delta '+deltaCls+'">'+esc(c.delta)+'</div>' : '')+'</div>';
  }).join("");
  return (b.periodTitle? '<div class="period-title">'+esc(b.periodTitle)+'</div>' : '')+'<div class="stats-grid">'+cards+'</div>';
}
function tableHTML(b){
  var rows = b.rows.map(function(r){
    var rowCls = r.resultType==="elu"?"row-elected":r.resultType==="pres"?"row-president":r.resultType==="vp"?"row-vp":"";
    var tdCls = r.resultType==="elu"?"result-elu":r.resultType==="pres"?"result-pres":r.resultType==="vp"?"result-vp":r.resultType==="non"?"result-non":"";
    return '<tr class="'+rowCls+'"><td class="name">'+esc(r.name)+'</td><td class="votes">'+esc(r.votes)+'</td><td class="'+tdCls+'">'+esc(r.resultText)+'</td></tr>';
  }).join("");
  return '<table class="data-table"><thead><tr><th>Candidat(e)</th><th style="text-align:center">Voix / valeur</th><th>Résultat</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function calloutHTML(b){
  var cls = b.variant==="info"?"info":b.variant==="green"?"green":"";
  return '<div class="callout '+cls+'">'+esc(b.text)+'</div>';
}
function proclistHTML(b){
  var items = b.items.map(function(it){
    var cls = it.variant==="auto"?"auto":it.variant==="conditional"?"conditional":"";
    return '<div class="proc-item '+cls+'"><div class="proc-icon">'+esc(it.icon)+'</div><div class="proc-text"><strong style="color:var(--white)">'+esc(it.title)+'</strong> — '+esc(it.text)+'</div></div>';
  }).join("");
  return '<div class="proc-list">'+items+'</div>';
}

function blockHTML(b){
  if(b.type==="text") return nl2p(b.content);
  if(b.type==="vote") return voteBlockHTML(b);
  if(b.type==="stats") return statsHTML(b);
  if(b.type==="table") return tableHTML(b);
  if(b.type==="callout") return calloutHTML(b);
  if(b.type==="proclist") return proclistHTML(b);
  return "";
}

function sectionHTML(sec, idx){
  var num = String(idx+1).padStart(2,"0");
  var body = sec.blocks.map(blockHTML).join("");
  return '<div class="section"><div class="section-header"><span class="section-num">'+num+'</span><h2 class="section-title">'+esc(sec.title)+'</h2></div><div class="section-line"></div>'+body+'</div>';
}

function compoHTML(){
  if(!state.compoGroups.length) return "";
  var groups = state.compoGroups.map(function(g){
    var rows = g.rows.filter(function(r){return r.name;}).map(function(r){
      var colorCls = r.color && r.color!=="default" ? r.color : "";
      return '<div class="compo-row"><span class="compo-name">'+esc(r.name)+'</span><span class="compo-role '+colorCls+'">'+esc(r.role)+'</span></div>';
    }).join("");
    return '<div class="compo-block"><div class="compo-block-header">'+esc(g.header)+'</div>'+rows+'</div>';
  }).join("");
  return '<p class="prose" style="margin-top:1.5rem;">Composition des instances à l\'issue de l\'Assemblée générale :</p><div class="compo-grid">'+groups+'</div>';
}

function buildDocument(){
  var m = state.meta;
  var presentCount = state.presence.presents.filter(function(r){return r.name;}).length + state.presence.proxies.filter(function(r){return r.name;}).length;
  var totalCount = presentCount + state.presence.absents.filter(function(r){return r.name;}).length;

  var html = '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">'
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
    + '<title>PV — '+esc(m.titleLine1)+' '+esc(m.titleLine2)+' | '+esc(m.badge)+'</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">'
    + '<style>'+DOC_CSS+'</style></head><body>'
    + '<header class="hero"><div class="hero-glow"></div><div class="hero-inner">'
    + '<div class="hero-badge">'+esc(m.badge)+'</div>'
    + '<div class="hero-label">'+m.label+'</div>'
    + '<h1 class="hero-title">'+esc(m.titleLine1)+'<br><em>'+esc(m.titleLine2)+'</em></h1>'
    + '<p class="hero-sub">'+esc(m.subtitle)+'</p>'
    + '<div class="hero-meta">'
    + '<div class="meta-item"><span class="meta-label">Président de séance</span><span class="meta-value">'+esc(m.president)+'</span></div>'
    + '<div class="meta-item"><span class="meta-label">Secrétaire de séance</span><span class="meta-value">'+esc(m.secretary)+'</span></div>'
    + '<div class="meta-item"><span class="meta-label">Ouverture</span><span class="meta-value">'+esc(m.ouverture)+'</span></div>'
    + '<div class="meta-item"><span class="meta-label">Clôture</span><span class="meta-value">'+esc(m.cloture)+'</span></div>'
    + '</div></div></header>'
    + '<main class="doc-body">'
    + '<div class="presence-grid">'
      + presenceHTML("Membres présents","present", state.presence.presents)
      + presenceHTML("Représentés par procuration","proxy", state.presence.proxies)
      + presenceHTML("Membres non présents","absent", state.presence.absents)
    + '</div>'
    + '<div class="quorum-bar"><div class="quorum-pct">'+esc(state.quorum.pct)+'</div><div class="quorum-text"><strong>'+esc(state.quorum.mainLine)+'</strong> '+esc(state.quorum.detailText)+'</div></div>'
    + state.sections.map(sectionHTML).join("")
    + compoHTML()
    + (state.closingNote? '<div class="callout green" style="margin-top:1rem;"><strong style="color:#4ade80">'+esc(state.closingNote)+'</strong></div>' : '')
    + '<div class="divider"></div>'
    + '<div class="signature-block">'+state.signatures.map(function(s){
        return '<div class="sig-item"><div class="sig-role">'+esc(s.role)+'</div><div class="sig-name">'+esc(s.name)+'</div><div class="sig-line"></div></div>';
      }).join("")+'</div>'
    + '</main>'
    + '<footer class="doc-footer"><strong>'+esc(state.footer.org)+'</strong> · Procès-Verbal — '+esc(m.subtitle)+' · '+esc(state.footer.rest)+'</footer>'
    + '</body></html>';
  return html;
}

/* ============================================================
   PREVIEW / DOWNLOAD / PRINT
============================================================ */
function updatePreview(){
  document.getElementById("preview").srcdoc = buildDocument();
}
function downloadDoc(){
  var html = buildDocument();
  var blob = new Blob([html], {type:"text/html"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var fname = "PV-AG-" + (state.meta.subtitle||"document").replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase().slice(0,40).replace(/^-+|-+$/g,"");
  a.href = url; a.download = (fname||"pv-assemblee-generale") + ".html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 2000);
}
function printDoc(){
  var f = document.getElementById("preview");
  f.contentWindow.focus();
  f.contentWindow.print();
}

/* ============================================================
   INIT
============================================================ */
state = exampleState();
renderBuilderRoot();
updatePreview();
</script>
</body>
</html>
